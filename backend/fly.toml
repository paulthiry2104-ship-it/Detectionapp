# Déploiement Fly.io — remplace "crypto-radar-pablo" par un nom libre.
app = "crypto-radar-pablo"
primary_region = "cdg"   # Paris

[build]

[env]
  PORT = "8080"
  DATABASE_PATH = "/data/radar.db"
  TZ_SCHEDULE = "Europe/Paris"
  SCHEDULER_ENABLED = "true"

[mounts]
  source = "radar_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Le planificateur tourne dans le serveur : la machine ne doit JAMAIS s'endormir.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "60s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
